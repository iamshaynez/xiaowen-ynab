# 合并 main 即发布:构建 money 镜像推 ACR,并部署到香港测试机。
# 构建机 hk-build 与部署目标同机,部署即 docker compose pull && up -d,无需 SSH 凭证。
# ① 登录用 shell docker login 而非 login-action:后者的 post 步骤会 logout,本机多 runner
#    实例共用 runner 用户(HOME 相同),并发 job 会互清对方凭据(实测)。
# ② 登录与 pull 均带重试:香港→阿里云 ACR(heyuan)auth 端点偶发跨境瞬断(connection reset)。
# ③ 冒烟轮询而非固定 sleep:应用冷启动时长不一(tsx 直跑的 gb-crm 需 20-40s)。
name: deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: [self-hosted, hk-build]
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/money:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/money:main

      - name: 部署到测试机(本机)
        run: |
          cd /opt/apps/money
          for i in 1 2 3; do docker compose pull && break; echo "pull 失败,第 $i 次重试"; sleep 8; done
          docker compose up -d

      - name: 冒烟验证(轮询)
        run: |
          for i in 1
2
3
4
5; do
            C=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/ || true)
            case "$C" in 200|302|401) echo "money 就绪($C,第 $i 轮)"; exit 0;; esac
            sleep 3
          done
          echo "money 未就绪"; docker logs money --tail 20; exit 1
