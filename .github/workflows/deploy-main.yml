# 合并 main 即发布:构建 money 镜像推 ACR,并部署到香港测试机。
# GitHub 托管 runner(public 仓库免费)构建推 ACR,再经 SSH 受限密钥部署到 hk-dev 测试机(2026-11-06 迁移,与 gb-pmo 同模式)。
# ① 登录用 shell docker login 而非 login-action:后者的 post 步骤会 logout,本机多 runner
#    实例共用 runner 用户(HOME 相同),并发 job 会互清对方凭据(实测)。
# ② 登录与 pull 均带重试:香港→阿里云 ACR(heyuan)auth 端点偶发跨境瞬断(connection reset)。
# ③ 冒烟轮询而非固定 sleep:应用冷启动时长不一(tsx 直跑的 gb-crm 需 20-40s)。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 个人版 ACR 不收 buildx attestation(vnd.oci.empty)——hosted runner 新 buildx 必触发,必须关
          provenance: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/money:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/money:main

      - name: SSH 受限部署到测试机(hk-dev)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOSTKEY: ${{ secrets.DEPLOY_HOSTKEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_HOSTKEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes deploy@207.57.130.82
